apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab5-pvc
spec:
  accessModes: ["ReadWriteOncePod"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: lab5-a
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: mydata
          mountPath: /data
  volumes:
    - name: mydata
      persistentVolumeClaim:
        claimName: lab5-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: lab5-b
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: mydata
          mountPath: /data
  volumes:
    - name: mydata
      persistentVolumeClaim:
