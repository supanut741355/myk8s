apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: keep-data
  namespace: storage
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab3-pvc
  namespace: storage
spec:
  storageClassName: keep-data
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: lab3
  namespace: storage
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: mydata
          mountPath: /data
  volumes:
    - name: mydata
      persistentVolumeClaim:
        claimName: lab3-pvc